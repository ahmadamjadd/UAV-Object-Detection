stages:
  generate_dataset:
    cmd: python src/data_generation/DataSetGeneration.py
    deps:
      - src/data_generation/
      - data/raw/
    params:
      - data_generation 
    outs:
      - data/generated/

  split_dataset:
    cmd: python src/split_dataset.py
    deps:
      - src/split_dataset.py
      - data/generated/
    params:
      - split
    outs:
      - data/split/

  train_model:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/split/
    params:
      - train
    outs:
      - runs/

  test_model:
    cmd: python src/test.py
    deps:
      - src/test.py
      - runs/
    always_changed: true
