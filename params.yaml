data_generation:
  n: 100
  size: 320
  shape_scale:
    s0: 0.2
    s1: 0.6
  noise: 50
  blur:
    b0: 0
    b1: 4
  brightness_diff: 100
  contrast:
    alpha0: 0.85
    alpha1: 1.2
  brightness:
    beta0: -20
    beta1: 20
  saturation:
    sat0: -10
    sat1: 0
  desaturate: 0
  letter:
    add_letter: 1
    letter_prob: 0.5
  shadow:
    add_light_gradient: 0
    blend_prob: 0.5
    opacity: 0.2

train:
  epochs: 3
  batch_size: 16

split:
  train: 0.80
  val: 0.20
