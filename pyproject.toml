[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foxtrot-local"
version = "0.1.0"
description = "Team Foxtrot local training application foundation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "colorama==0.4.6",
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "ultralytics==8.4.174",
    "mlflow==3.17.0",
    "dvc==3.67.1",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.4",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["foxtrot", "foxtrot.*"]
namespaces = false

[tool.setuptools.package-data]
# The built browser interface (npm run build in frontend/) ships inside the package.
"foxtrot.api" = ["static/*.html", "static/assets/*"]
